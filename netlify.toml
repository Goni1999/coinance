[build]
  # Build settings (not needed for static site, but good to have)
  publish = "."
  command = "echo 'No build needed for static site'"

[build.environment]
  # Environment variables (if needed)
  NODE_VERSION = "18"

# Form settings
[[forms]]
  name = "contact"
  action = "/thank-you.html"
  
# Email notifications for form submissions
[[forms.notifications]]
  type = "email"
  event = "submission"
  to = "support@coinance.co"
  subject = "New Lead from Coinance Website"
  body = """
  New contact form submission:
  
  Name: {{ name }}
  Email: {{ email }}
  Phone: {{ phone }}
  Company: {{ company }}
  Service: {{ service }}
  Message: {{ message }}
  
  Submitted: {{ created_at }}
  """

# Redirects
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#intro"
  status = 301

# 404 redirect to home page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://images.unsplash.com https://cdnjs.cloudflare.com data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.google-analytics.com"

# Cache settings for static assets
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Preload important resources
[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '''
    </styles.css>; rel=preload; as=style,
    </script.js>; rel=preload; as=script,
    <https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap>; rel=preload; as=style
    '''

# Enable Netlify Analytics (optional)
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "preview" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" } 